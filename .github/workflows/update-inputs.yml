name: Update flake inputs

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday 02:00 UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    name: Update inputs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create-pull-request pushes the update/flake-inputs branch
      pull-requests: write # create-pull-request opens the PR
      actions: write # cache-nix-action purge deletes old caches via the API

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      # Binary cache — speeds up subsequent runs significantly
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Install tools
        run: |
          NIXPKGS_REV=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          nix profile install \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#just" \
            "github:NixOS/nixpkgs/${NIXPKGS_REV}#emacs-nox"

      # `just update` refreshes the package registries (melpa, gnu-elpa, …)
      # and regenerates lock/flake.nix; `just lock` pins individual package revs.
      # Both commands internally pass --impure to read from the working tree.
      - name: Update inputs and regenerate lock
        run: just update && just lock

      # Build the PR body: static header + `just review` output (compare URLs)
      - name: Generate PR body
        run: |
          {
            cat <<'HEADER'
          Automated weekly update of Nix flake inputs.

          For `.el` file diffs, check out this branch and run locally:
          ```sh
          just diff-el main
          ```

          <details><summary>Changed packages (just diff-lock)</summary>

          ```
          HEADER
            just diff-lock 2>/dev/null || echo '(diff-lock failed)'
            printf '```\n</details>\n'
          } > /tmp/pr-body.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/flake-inputs
          commit-message: 'chore: update flake inputs'
          title: 'chore: update flake inputs'
          body-path: /tmp/pr-body.md
          labels: dependencies
          # The action also commits, upserts the branch and the PR; gh pr
          # create is not a drop-in replacement, so the audit is N/A here.
          delete-branch: true # zizmor: ignore[superfluous-actions]
