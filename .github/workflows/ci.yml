name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # actions/checkout reads the repo
      actions: write # cache-nix-action purge deletes old caches via the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      # Auth to Cachix (cachix use + authtoken) but do NOT let the daemon do the
      # pushing: skipPush keeps it from watching the store. The daemon only pushes
      # paths Nix *builds* during the run, but cache-nix-action above restores the
      # whole store first, so almost nothing is rebuilt and almost nothing would be
      # pushed. We push the full closure explicitly below instead.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: fenril058
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true

      # `nix flake check` builds packages.x86_64-linux.default (the Emacs env) and
      # earlyInitEl. --accept-flake-config trusts the substituters declared in
      # flake.nix; -L streams build logs so compile failures are visible.
      - name: nix flake check
        run: nix flake check --accept-flake-config -L

      # Explicitly push the full closure of the built outputs to Cachix. Unlike the
      # cachix daemon, `cachix push` uploads the entire closure of the given paths
      # regardless of whether they were built this run or restored from the store
      # cache — so `home-manager switch` finds every package prebuilt. The token is
      # empty on PRs from forks and Dependabot (secrets denied); skip cleanly then.
      - name: Push closure to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "No Cachix auth token (fork/Dependabot PR); skipping push."
            exit 0
          fi
          nix build --accept-flake-config --no-link --print-out-paths \
            .#default .#earlyInitEl \
            | cachix push fenril058
