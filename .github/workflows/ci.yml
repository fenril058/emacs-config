name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # cache-nix-action purge deletes old caches via the API
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      # Auth to Cachix and push every store path built below. With this action
      # active, paths realised during the build are pushed to fenril058.cachix.org,
      # so `home-manager switch` can pull prebuilt binaries instead of compiling.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: fenril058
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: nix flake check
        run: nix flake check --accept-flake-config

      # Build the Emacs package set so its closure gets pushed to Cachix.
      # --accept-flake-config trusts the substituters declared in flake.nix.
      - name: Build Emacs package set
        run: |
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          nix build ".#packages.$system.default" --accept-flake-config --print-build-logs
