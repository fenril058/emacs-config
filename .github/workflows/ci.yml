name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # actions/checkout reads the repo
      actions: write # cache-nix-action purge deletes old caches via the API
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      # Auth to Cachix and push every store path built below. With this action
      # active, paths realised during the build are pushed to fenril058.cachix.org,
      # so `home-manager switch` can pull prebuilt binaries instead of compiling.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: fenril058
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # `nix flake check` already builds packages.x86_64-linux.default (and
      # earlyInitEl, devShell, formatter), so cachix-action picks up and pushes
      # the Emacs package closure from here — no separate build step needed.
      # --accept-flake-config trusts the substituters declared in flake.nix;
      # -L streams build logs so compile failures are visible.
      - name: nix flake check
        run: nix flake check --accept-flake-config -L
